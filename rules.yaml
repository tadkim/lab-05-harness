# 판정 수치 SSOT. 숫자는 이 파일에만 둔다.
# 토큰 값은 복사하지 않고 이름만 적는다. 값은 tokens/figma-variables.json에서 읽는다.

components:
  image-slider:      { run: required }
  video-player:      { run: required }
  playback-progress: { run: optional }   # video-player에 재생바를 쓸 때만

required_states:          # 완료 기준 (PRD 14장)
  image-slider:      [Desktop, Mobile, Previous/Next, Current Index, Focus]
  video-player:      [Idle, Playing, Paused, Play/Pause Button, Focus]
  playback-progress: [Default, Hover, Focus, Dragging]

phases:                   # 출력 위치: runs/<component>/
  P1: research/p1-research.md
  P2: design/p2-options.md
  P3: design/p3-figma.json
  P4: gate/p4-gate.json
  P5: handoff/p5-handoff.md

agents:
  researcher: { folder: research/, phases: [P1] }
  designer:   { folder: design/,   phases: [P2, P3], figma_page: "harness/<component>" }
  judge:      { folder: gate/,     read_only: true, extra_output: checks.json }
  handoff:    { folder: handoff/,  phases: [P5] }

p2:
  options_min: 2
  options_max: 3
  option_heading: "### 안 "    # 안 1개 = 이 제목 1개
  approval_line: "승인: yes"   # 이 줄이 있어야 P2 완료
  approval_hash_line: "승인해시: "  # 승인 시점의 p1 + p2 내용 해시. 내용이 바뀌면 승인 무효
  choice_line: "선택: "        # 뒤에 안 이름 1개

retry:
  p4_fail_to_p3: 2
  p2_reject_to_p1: 1

resume:
  rule: "가장 높은 번호의 Phase 파일 다음 Phase부터 시작"
  p4_attempt_field: attempt

tokens:                   # 게이트가 참조할 토큰 이름 (R5에서 조건 추가)
  source: tokens/figma-variables.json
  hit_area_min: control/hit-area/min
  focus_ring_width: focus/ring/width
  focus_ring_color: semantic/border/focus

p1:
  references_min: 3               # 레퍼런스마다 URL 필수
  reference_heading: "### R"      # 레퍼런스 1개 = "### R<번호>" 제목 1개
  url_line: "URL: http"           # 레퍼런스 블록 안에 이 줄로 시작하는 줄 1개 이상

figma_naming:                     # designer가 지키고 judge가 읽는 레이어 이름 규칙
  interactive_prefix: "btn-"      # 조작 영역 frame. 이름 = btn-<접근 가능한 이름>
  icon_prefix: "icon-"

gates:
  # --- P1 / P2 : 형식 확인. FAIL이면 같은 Phase를 다시 한다 ---
  p1_references:
    phase: P1
    check: "p1-research.md의 레퍼런스 개수 >= p1.references_min, URL이 없는 레퍼런스 = 0"
    on_fail: P1
  p2_options:
    phase: P2
    check: "안 개수가 p2.options_min 이상 p2.options_max 이하, choice_line 1개, approval_line 1개, 승인해시가 현재 p1 + p2 내용과 같다"
    on_fail: P2
    human_approval: true          # 하네스 전체에서 사람이 승인하는 유일한 곳

  # --- P4 : 판정자가 Figma를 직접 측정한다. FAIL이면 P3으로 ---
  required_states:
    phase: P4
    applies_to: all
    check: "required_states[component]의 이름이 모두 variant 이름에 있다"
    on_fail: P3
  hit_area:
    phase: P4
    applies_to: all
    check: "인터랙티브 노드의 width, height >= tokens.hit_area_min"
    on_fail: P3
  focus_ring:
    phase: P4
    applies_to: all
    check: "Focus variant의 stroke 두께 = tokens.focus_ring_width, 색 = tokens.focus_ring_color"
    on_fail: P3
  accessible_name:
    phase: P4
    applies_to: all
    check: "아이콘만 있는 버튼 중 label이 비어 있는 것 = 0"
    on_fail: P3
  token_binding:
    phase: P4
    applies_to: all
    check: "변수에 연결되지 않은 fill, stroke, spacing, radius = 0"
    on_fail: P3

  # --- 서비스 기준 (story-service.md A, B) ---
  service_a_index_text:           # A. 색상 하나로만 상태 전달 금지
    phase: P4
    applies_to: [image-slider]
    check: "텍스트 노드 중 pattern에 맞는 것 >= 1"
    pattern: "^\\d+\\s*/\\s*\\d+$"
    on_fail: P3
  service_a_play_state:           # A. 색상 하나로만 상태 전달 금지
    phase: P4
    applies_to: [video-player]
    check: "Playing과 Paused variant의 아이콘 이름 또는 label이 서로 다르다"
    on_fail: P3
  service_b_no_autoplay:          # B. 임의 전환 금지
    phase: P4
    applies_to: all
    check: "프로토타입 트리거 중 AFTER_TIMEOUT = 0"
    on_fail: P3
  service_b_handoff:              # B. 임의 전환 금지
    phase: P5
    applies_to: all
    check: "p5-handoff.md에 line과 정확히 같은 줄이 있다 (문장 속 언급은 세지 않음)"
    line: "autoplay: false"
    on_fail: P5
